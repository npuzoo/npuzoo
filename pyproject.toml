[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npuzoo"
version = "0.1.0"
description = "Run AI models on NPU single-board computers. One command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "npuzoo contributors" }]
keywords = ["npu", "rk3588", "rk3576", "rockchip", "rkllm", "rknn", "edge-ai", "sbc"]
dependencies = []

[project.scripts]
npuzoo = "npuzoo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
