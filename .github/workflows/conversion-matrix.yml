name: conversion matrix

# Converts small, openly licensed models with several rkllm-toolkit releases
# (the pairs listed in pipeline/matrix/plan.json), for several chips and
# weight formats, on a CPU-only GitHub runner, and
# records what worked and where the rest failed. Conversion only: nothing is
# run on a board, and the converted files are measured, then deleted.
# Results: docs/conversion-matrix.md and matrix/conversion.json.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/matrix/**
      - .github/workflows/conversion-matrix.yml

concurrency:
  group: conversion-matrix
  cancel-in-progress: true

jobs:
  plan:
    # which (toolkit, model) pairs to run: pipeline/matrix/plan.json
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.p.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "include=$(python3 -c 'import json; print(json.dumps(json.load(open("pipeline/matrix/plan.json"))["runs"]))')" >> "$GITHUB_OUTPUT"

  convert:
    needs: plan
    name: ${{ matrix.toolkit }} · ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - name: make room (disk and swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          df -h / ; free -g

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: fetch rkllm-toolkit ${{ matrix.toolkit }} from Rockchip's repository
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout --branch "release-v${{ matrix.toolkit }}" \
            https://github.com/airockchip/rknn-llm /tmp/rknn-llm
          whl=$(git -C /tmp/rknn-llm ls-tree -r --name-only HEAD | grep -E 'rkllm_toolkit-.*-cp310-cp310-linux_x86_64\.whl$' | head -1)
          test -n "$whl"
          git -C /tmp/rknn-llm checkout HEAD -- "$whl"
          echo "WHL=/tmp/rknn-llm/$whl" >> "$GITHUB_ENV"

      - name: install it (CPU-only torch)
        id: install
        run: |
          if python pipeline/matrix/install_toolkit.py "$WHL" > /tmp/install.log 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
          tail -40 /tmp/install.log
          pip install -q -e .          # npuzoo itself, for the file-signature check

      - name: convert
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          slug=$(echo "${{ matrix.model }}" | tr '/' '_')
          out="results/${{ matrix.toolkit }}__${slug}.json"
          if [ "${{ steps.install.outputs.ok }}" = "1" ]; then
            python pipeline/matrix/convert_one.py --model "${{ matrix.model }}" --toolkit "${{ matrix.toolkit }}" --out "$out"
          else
            python pipeline/matrix/convert_one.py --model "${{ matrix.model }}" --toolkit "${{ matrix.toolkit }}" \
              --install-log /tmp/install.log --out "$out"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: results/
          if-no-files-found: ignore
          retention-days: 30

  collect:
    needs: convert
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: result-*
          merge-multiple: true
      - name: build the table
        run: |
          git pull -q origin main
          python pipeline/matrix/collect.py results --merge matrix/conversion.json \
            --json matrix/conversion.json --md docs/conversion-matrix.md
      - name: commit it if it changed
        run: |
          git add matrix/conversion.json docs/conversion-matrix.md
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update conversion matrix"
          git pull --rebase origin main
          git push origin HEAD:main
